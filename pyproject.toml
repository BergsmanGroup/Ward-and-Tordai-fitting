[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ward-tordai-fit"
version = "0.1.0"
description = "Ward-Tordai profile-fitting application for dynamic surface tension data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PySide6>=6.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ward-tordai = "ward_tordai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Package desktop applications

on:
  workflow_dispatch:

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: WardTordai-windows
            file: dist/WardTordai.exe
          - name: macOS
            os: macos-latest
            artifact: WardTordai-macos
            file: dist/WardTordai-macos.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: python package.py

      - name: Create portable macOS ZIP
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/WardTordai.app dist/WardTordai-macos.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
